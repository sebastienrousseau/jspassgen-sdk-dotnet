# SPDX-License-Identifier: Apache-2.0 OR MIT
name: Bug report
description: Report a reproducible problem in jspassgen-sdk-dotnet
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: >-
        Issues are public. Never paste a password, passphrase or other
        secret you use. Report a vulnerability privately as SECURITY.md
        describes, not here.
  - type: input
    id: version
    attributes:
      label: jspassgen-sdk-dotnet version
      placeholder: "0.0.22"
    validations:
      required: true
  - type: dropdown
    id: dotnet_version
    attributes:
      label: .NET runtime
      options:
        - ".NET 10"
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproducible example
      description: The smallest code and configuration that show the problem.
      render: csharp
    validations:
      required: true
  - type: textarea
    id: error_output
    attributes:
      label: Error output
      render: text
