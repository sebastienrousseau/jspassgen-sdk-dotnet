# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Format; build (warnings as errors, .NET analysers, complexity
# ceilings) and unit tests with the 100 % coverage gate on three
# operating systems, plus the package build; the vulnerable-package
# audit; the Halstead check; and the version check. DEVELOPMENT.md maps
# each job to a local command.
name: CI

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: dotnet format --verify-no-changes
        run: dotnet format Jspassgen.slnx --verify-no-changes

  build-test:
    name: Build and unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build (Release, warnings as errors)
        run: dotnet build Jspassgen.slnx -c Release

      - name: Unit tests, 100% line and branch coverage
        run: dotnet test tests/Jspassgen.Tests -c Release --no-build -p:CollectCoverage=true

      - name: Pack with package validation (not published)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack src/Jspassgen -c Release --no-build -o artifacts/package

  audit:
    name: Vulnerable packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: dotnet list package --vulnerable
        run: |
          set -euo pipefail
          dotnet restore Jspassgen.slnx --locked-mode
          out="$(dotnet list Jspassgen.slnx package --vulnerable --include-transitive 2>&1)"
          echo "$out"
          if echo "$out" | grep -q "has the following vulnerable packages"; then
            exit 1
          fi

  complexity:
    name: Complexity (Halstead difficulty; the build enforces the rest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: scripts/halstead.py (ceiling 30)
        run: |
          python -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --require-hashes --no-deps -r ci/lint-requirements.txt
          "$RUNNER_TEMP/lint/bin/python" scripts/halstead.py

  versions:
    name: Release versions agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: scripts/verify-release-versions
        run: scripts/verify-release-versions
